services:
  disk-reclaim:
    build: .
    image: disk-reclaim:latest
    container_name: disk-reclaim
    ports:
      - "8000:8000"
    environment:
      # 预置镜像块数（每块 4 KiB），256 块 = 1 MiB
      BLOCK_COUNT: "256"
      IMAGE_PATH: "/data/disk.raw"
      PORT: "8000"
      # 掉电演练钩子：>0 时刷盘在“恢复记录已提交”及每块回写前各睡该毫秒数，
      # 放大 kill -9 的命中窗口；正常运行为 0
      FLUSH_DELAY_MS: "0"
    volumes:
      # 命名卷持久化 raw 镜像；docker 会自动创建，默认在 ext4 之上，支持打洞
      - disk-data:/data
    restart: unless-stopped

volumes:
  disk-data:
